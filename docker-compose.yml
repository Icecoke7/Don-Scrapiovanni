services:
  staatsoper-scraper:
    container_name: staatsoper-scraper
    image: gewoscout-staatsoper:local
    restart: unless-stopped
    depends_on:
      - azurite
    environment:
      - TZ=Europe/Vienna
      - FUNCTIONS_WORKER_RUNTIME=python
      - FUNC_APP_FILE=function_app_staatsoper.py
      - QUEUE_NAME=scraper-result-queue
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    env_file:
      - .env

  housing-scraper:
    container_name: housing-scraper
    image: gewoscout-housing-scraper:local
    restart: unless-stopped
    depends_on:
      - azurite
    environment:
      - TZ=Europe/Vienna
      - FUNCTIONS_WORKER_RUNTIME=python
      - FUNC_APP_FILE=function_app_housing.py
      - QUEUE_NAME=scraper-result-queue
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    env_file:
      - .env

  azurite:
    container_name: azurite
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    volumes:
      - azurite-data:/data
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data"

volumes:
  azurite-data:
